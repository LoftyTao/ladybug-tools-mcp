[build-system]
requires = ["setuptools>=77", "wheel>=0.40", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "lbt-mcp"
version = "1.3.0"
description = "A FastMCP server for Ladybug Tools workflows."
readme = "README.md"
dynamic = ["dependencies"]
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "licenses/THIRD_PARTY_NOTICES.md"]

[project.scripts]
lbt-mcp = "ladybug_tools_mcp_cli:main"

[project.urls]
Homepage = "https://github.com/LoftyTao/ladybug-tools-mcp"

[tool.setuptools]
py-modules = ["ladybug_tools_mcp_cli"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["grasshopper_components*", "ironbug_bridge*", "pyhygrothermfem_native*"]

[tool.setuptools.package-data]
fairyfly_next_therm = [
  "_templates/*.xml",
  "config.json",
  "LICENSE",
]
pyhygrothermfem_fairyfly = [
  "_build_source.json",
  "third_party_notices.txt",
  "third_party_licenses/*/*",
]
honeybee_gbas = [
  "LICENSE",
  "dwg/LICENSE-ezdwg.txt",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]
extend-exclude = ["resources", "vendor", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = ["E501", "UP035", "UP038", "B905"]

[tool.pyright]
include = ["src/ladybug_tools_mcp"]
exclude = [
  "src/flowerpot/runtime.py",
  "src/flowerpot/component_state.py",
  "src/flowerpot/input_guard.py",
  "src/flowerpot/installation.py",
  "src/flowerpot/worker.py",
  "src/grasshopper_components",
  "src/fairyfly_next_therm",
  "src/pyhygrothermfem_fairyfly",
  "resources",
  "vendor",
  "build",
  "dist",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
