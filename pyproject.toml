[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lbt-mcp"
version = "1.3.0.dev0"
description = "A FastMCP server for Ladybug Tools workflows."
readme = "README.md"
dynamic = ["dependencies"]
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE"]

[project.scripts]
lbt-mcp = "ladybug_tools_mcp_cli:main"
python-ironbug-console = "garden.ironbug_console.cli:main"

[project.urls]
Homepage = "https://github.com/LoftyTao/ladybug-tools-mcp"

[tool.setuptools]
py-modules = ["ladybug_tools_mcp_cli", "ladybug_tools_mcp_clients"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["grasshopper_components*"]

[tool.setuptools.package-data]
ladybug_tools_mcp = [
  "resources/weather/*/*.epw",
  "resources/weather/*/*.ddy",
  "resources/weather/*/*.stat",
]
