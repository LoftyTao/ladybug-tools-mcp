[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ladybug-tools-mcp"
version = "1.2.0"
description = "A FastMCP server for Ladybug Tools workflows."
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[project.scripts]
python-ironbug-console = "garden.ironbug_console.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ladybug_tools_mcp = [
  "resources/weather/*/*.epw",
  "resources/weather/*/*.ddy",
  "resources/weather/*/*.stat",
]
