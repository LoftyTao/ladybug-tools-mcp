name: Distribution

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
      - name: Build wheel from source distribution
        run: uv build
      - name: Check metadata and release version
        run: |
          uvx twine check dist/*
          uv run --no-project --python 3.12 python -c 'import os,tomllib; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert not os.environ["GITHUB_REF"].startswith("refs/tags/") or os.environ["GITHUB_REF_NAME"] == "v"+v'
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
      - name: Install wheel and exercise isolated runtime
        shell: pwsh
        run: |
          uv venv --python 3.12 .distribution-runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = if ($IsWindows) { '.distribution-runner/Scripts/python.exe' } else { '.distribution-runner/bin/python' }
          $wheel = (Get-ChildItem dist/*.whl).FullName
          uv pip install --python $python --prerelease allow --only-binary ':all:' --no-binary luigi $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I tests/deterministic/validate_preview_local_bind.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I tests/deterministic/validate_distribution.py --wheel $wheel --root (Join-Path $env:RUNNER_TEMP 'distribution 验收')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/distribution 验收/*.log
            ${{ runner.temp }}/distribution 验收/protocol.json
            ${{ runner.temp }}/distribution 验收/discovery.json
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
